<body>
  <main id="login" class="login">
    <p class="eyebrow">ADMIN</p><h1>後台管理</h1>
    <form id="loginForm">
      <label>管理員帳號<input name="account" autocomplete="username" required></label>
      <label>密碼<input name="password" type="password" autocomplete="current-password" required></label>
      <p id="loginError" class="error hidden"></p>
      <button class="button primary" type="submit">登入</button>
    </form>
    <p class="version-stamp">Lockspace Admin v0.20.0</p>
  </main>

  <main id="dashboard" class="shell hidden">
    <header class="top"><div><div class="brand">lockspace<b>.</b> 管理</div><span class="version-stamp">v0.20.0</span></div><div class="actions"><button id="refreshAll" class="button" type="button" data-admin-copy="refresh" data-no-translate>重新整理</button><a class="button" href="index.html">會員頁</a><button id="logout" class="button" type="button">登出</button></div></header>
    <p id="dashboardError" class="error hidden" role="alert" data-no-translate></p>
    <p id="actionError" class="error hidden" role="alert" data-no-translate></p>
    <p id="actionStatus" class="action-status hidden" role="status" data-no-translate></p>
    <section class="stats"><div class="stat"><span class="muted">會員</span><strong id="total">—</strong></div><div class="stat"><span class="muted">待查驗</span><strong id="pending">—</strong></div><div class="stat"><span class="muted">已通過</span><strong id="approved">—</strong></div></section>
    <div class="member-toolbar"><label class="member-search"><span data-admin-copy="search" data-no-translate>搜尋帳號或顯示名稱</span><input id="memberSearch" type="search" autocomplete="off"></label><label class="member-filter"><span data-admin-copy="verificationStatus" data-no-translate>查驗狀態</span><select id="memberStatusFilter" data-no-translate><option value="all" data-admin-copy="allStatuses">所有狀態</option><option value="pending" data-admin-copy="pending">待查驗</option><option value="approved" data-admin-copy="approved">已通過</option><option value="rejected" data-admin-copy="rejected">已退回</option><option value="unknown" data-admin-copy="unknown">未提供狀態</option></select></label><button id="clearMemberFilters" class="button" type="button" data-admin-copy="clear" data-no-translate>清除篩選</button></div>
    <p id="memberResultCount" class="muted result-count" role="status" data-no-translate></p>
    <div id="membersLoadNotice" class="section-notice hidden"><p id="membersLoadStatus" role="status" data-no-translate></p><button class="button hidden" type="button" data-retry-section="members" data-admin-copy="retry" data-no-translate>重試</button></div>
    <div class="table-wrap"><table><caption>會員</caption><thead><tr><th>帳號</th><th>顯示名稱</th><th data-admin-copy="verificationStatus" data-no-translate>查驗狀態</th><th>生日</th><th>膚色</th><th>身材</th><th>操作</th></tr></thead><tbody id="memberRows"></tbody></table><div id="empty" class="empty hidden" data-no-translate>尚無會員資料</div></div>
    <section style="margin-top:28px"><h2>任務與檢舉</h2><p class="muted">檢視已發布任務、接受會員檢舉或刪除違規內容。</p><div id="tasksLoadNotice" class="section-notice hidden"><p id="tasksLoadStatus" role="status" data-no-translate></p><button class="button hidden" type="button" data-retry-section="tasks" data-admin-copy="retry" data-no-translate>重試</button></div><div class="table-wrap" style="margin-top:14px"><table><caption>任務與檢舉</caption><thead><tr><th>發布者</th><th>日期</th><th>任務細項</th><th>檢舉</th><th>處理狀態</th><th>操作</th></tr></thead><tbody id="taskRows"></tbody></table><div id="taskEmpty" class="empty hidden">尚無任務紀錄</div></div></section>
    <section style="margin-top:28px"><h2>用戶任務提案</h2><p class="muted">通過的提案會加入「用戶提供」每日任務池。</p><div id="ideasLoadNotice" class="section-notice hidden"><p id="ideasLoadStatus" role="status" data-no-translate></p><button class="button hidden" type="button" data-retry-section="ideas" data-admin-copy="retry" data-no-translate>重試</button></div><div class="table-wrap" style="margin-top:14px"><table><caption>用戶任務提案</caption><thead><tr><th>會員</th><th>提案內容</th><th>時間</th><th>狀態</th><th>操作</th></tr></thead><tbody id="ideaRows"></tbody></table><div id="ideaEmpty" class="empty hidden">尚無任務提案</div></div></section>
    <section style="margin-top:28px"><h2>問題回饋</h2><p class="muted">查看會員從登入後首頁送出的意見與內容。</p><div id="feedbackLoadNotice" class="section-notice hidden"><p id="feedbackLoadStatus" role="status" data-no-translate></p><button class="button hidden" type="button" data-retry-section="feedback" data-admin-copy="retry" data-no-translate>重試</button></div><div class="table-wrap" style="margin-top:14px"><table><caption>問題回饋</caption><thead><tr><th>會員</th><th>意見</th><th>內容</th><th>時間</th><th>狀態</th><th>操作</th></tr></thead><tbody id="feedbackRows"></tbody></table><div id="feedbackEmpty" class="empty hidden">尚無回饋</div></div></section>
  </main>

  <dialog id="proofDialog"><div class="proof-head"><strong>生日查驗照片</strong><button id="closeProof" class="button" type="button">關閉</button></div><div class="proof-body"><img id="proofImage" alt="證件生日照片"></div></dialog>
  <dialog id="replyDialog"><form id="replyForm"><div class="proof-head"><strong>回覆會員</strong><button id="closeReply" class="button" type="button">關閉</button></div><div class="reply-body"><label>回覆內容<textarea name="reply" maxlength="1200" required></textarea></label><p id="replyError" class="error hidden"></p></div><div class="reply-actions"><button class="button primary" type="submit">送出回覆</button></div></form></dialog>

  <script src="i18n-ui-1.js"></script><script src="i18n-ui-2.js"></script><script src="i18n-ui-3.js"></script><script src="i18n-ui-4.js"></script>
  <script src="i18n-content.js"></script>
  <script>LockspaceI18n.init();</script>
  <script type="module">

    const APP_VERSION="0.20.0";
    const config={apiKey:"AIzaSyCaM21hcPsRHxJ-YdIzWpjPu0aneRPPvOI",authDomain:"lockspace-19edc.firebaseapp.com",projectId:"lockspace-19edc",storageBucket:"lockspace-19edc.firebasestorage.app",messagingSenderId:"726438557640",appId:"1:726438557640:web:d0e51ec0280cd1066e32fd"};
    const app=initializeApp(config,"lockspace-admin"),auth=getAuth(app),db=getFirestore(app);await setPersistence(auth,browserSessionPersistence);

    // New controls use Traditional Chinese, Simplified Chinese, or English fallback.

    const ADMIN_COPY = {
      "zh-Hant": { refresh:"重新整理", retry:"重試", search:"搜尋帳號或顯示名稱", verificationStatus:"查驗狀態", allStatuses:"所有狀態", pending:"待查驗", approved:"已通過", rejected:"已退回", unknown:"未提供狀態", clear:"清除篩選", results:"顯示 {shown} / {total} 位會員", noResults:"沒有符合條件的會員。請調整搜尋或清除篩選。", noMembers:"尚無會員資料", loading:"載入中…", loadFailed:"此區塊載入失敗，請確認連線後重試。", partialFailure:"部分管理資料載入失敗。可在該區塊重試，或重新整理全部資料。", operationBusy:"正在處理，請稍候…", operationDone:"操作已完成。", refreshFailed:"操作已完成，但列表更新失敗。請重新整理確認最新狀態。", proofError:"無法開啟查驗照片，請確認連線後重試。", proofMissing:"尚未上傳證件生日照片。", proofOpened:"已開啟查驗照片。", reportsError:"檢舉更新未完成，請重新整理確認後重試。", reportsDone:"檢舉處理已更新。", ideaError:"提案審核未完成，請重新整理確認後重試。", ideaDone:"提案審核已更新。" },
      "zh-Hans": { refresh:"刷新", retry:"重试", search:"搜索账号或显示名称", verificationStatus:"查验状态", allStatuses:"所有状态", pending:"待查验", approved:"已通过", rejected:"已退回", unknown:"未提供状态", clear:"清除筛选", results:"显示 {shown} / {total} 位会员", noResults:"没有符合条件的会员。请调整搜索或清除筛选。", noMembers:"暂无会员资料", loading:"加载中…", loadFailed:"此区域加载失败，请确认连接后重试。", partialFailure:"部分管理资料加载失败。可在该区域重试，或刷新全部资料。", operationBusy:"正在处理，请稍候…", operationDone:"操作已完成。", refreshFailed:"操作已完成，但列表更新失败。请刷新确认最新状态。", proofError:"无法打开查验照片，请确认连接后重试。", proofMissing:"尚未上传证件生日照片。", proofOpened:"已打开查验照片。", reportsError:"举报更新未完成，请刷新确认后重试。", reportsDone:"举报处理已更新。", ideaError:"提案审核未完成，请刷新确认后重试。", ideaDone:"提案审核已更新。" },
      en: { refresh:"Refresh", retry:"Retry", search:"Search username or display name", verificationStatus:"Verification status", allStatuses:"All statuses", pending:"Pending", approved:"Approved", rejected:"Rejected", unknown:"No status", clear:"Clear filters", results:"Showing {shown} of {total} members", noResults:"No matching members. Adjust your search or clear the filters.", noMembers:"No members yet", loading:"Loading…", loadFailed:"This section could not load. Check your connection and retry.", partialFailure:"Some sections could not load. Retry a section or refresh all data.", operationBusy:"Processing. Please wait…", operationDone:"Action completed.", refreshFailed:"Action completed, but the list could not refresh. Refresh to confirm the latest status.", proofError:"The verification photo could not open. Check your connection and retry.", proofMissing:"No verification photo has been uploaded.", proofOpened:"Verification photo opened.", reportsError:"Report updates did not finish. Refresh to confirm the current status before retrying.", reportsDone:"Report status updated.", ideaError:"The proposal review did not finish. Refresh to confirm the current status before retrying.", ideaDone:"Proposal review updated." }

    function adminCopy(key) {

    function syncAdminCopy() {

      headings.forEach(heading => { heading.setAttribute("scope", "col"); heading.setAttribute("role", "columnheader"); });

        row.setAttribute("role", "row");

    function updateOperationButtons() {

    document.querySelectorAll("[data-retry-section]").forEach(button => button.addEventListener("click", () => loadSection(button.dataset.retrySection)));
    document.getElementById("memberSearch").addEventListener("input", renderMembers);
    document.getElementById("memberStatusFilter").addEventListener("change", renderMembers);
    document.getElementById("clearMemberFilters").addEventListener("click", () => { document.getElementById("memberSearch").value = ""; document.getElementById("memberStatusFilter").value = "all"; renderMembers(); document.getElementById("memberSearch").focus(); });
    document.querySelector("[data-global-language] select")?.addEventListener("change", () => { syncAdminCopy(); });
    syncAdminCopy();
    document.getElementById("loginForm").addEventListener("submit",async event=>{event.preventDefault();const data=Object.fromEntries(new FormData(event.target));try{await signInWithEmailAndPassword(auth,accountEmail(data.account),data.password)}catch{showError("帳號、密碼或管理權限不正確。")}});
    document.getElementById("logout").addEventListener("click",()=>signOut(auth));
    document.getElementById("closeProof").addEventListener("click",()=>document.getElementById("proofDialog").close());
    document.getElementById("closeReply").addEventListener("click",()=>document.getElementById("replyDialog").close());
    document.getElementById("replyForm").addEventListener("submit",submitFeedbackReply);
    onAuthStateChanged(auth,async user=>{if(!user){login.classList.remove("hidden");dashboard.classList.add("hidden");return}try{const admin=await getDoc(doc(db,"admins",user.uid));if(!admin.exists()){showError("這個帳號沒有管理權限。");await signOut(auth);return}login.classList.add("hidden");dashboard.classList.remove("hidden");await loadAll()}catch{await signOut(auth);showError("管理資料載入失敗，請檢查網路後再試。")}});
    function verificationState(member) {
      const status = member.verification?.status;
      return ["pending", "approved", "rejected"].includes(status) ? status : "unknown";
    }
    async function loadMembers() {
      const snapshot = await getDocs(collection(db, "members"));
      allMembers = snapshot.docs.map(item => ({ id:item.id, ...item.data() })).filter(member => member.deleted !== true);
      membersLoaded = true;
      document.getElementById("total").textContent = allMembers.length;
      document.getElementById("pending").textContent = allMembers.filter(member => verificationState(member) === "pending").length;
      document.getElementById("approved").textContent = allMembers.filter(member => verificationState(member) === "approved").length;
      renderMembers();
    }
    function renderMembers() {
      if (!membersLoaded) return;
      const search = document.getElementById("memberSearch").value.trim().toLocaleLowerCase();
      const status = document.getElementById("memberStatusFilter").value;
      const members = allMembers.filter(member => (!search || [member.username, member.profile?.displayName].some(value => String(value || "").toLocaleLowerCase().includes(search))) && (status === "all" || verificationState(member) === status));
      document.getElementById("memberResultCount").textContent = adminCopy("results").replace("{shown}", members.length).replace("{total}", allMembers.length);
      const empty = document.getElementById("empty");
      empty.classList.toggle("hidden", members.length > 0);
      empty.textContent = adminCopy(allMembers.length ? "noResults" : "noMembers");
      rows.innerHTML = members.map(member => {
        const profile = member.profile || {}, state = verificationState(member);
        return `<tr><td data-no-translate>${esc(member.username || "—")}</td><td data-no-translate>${esc(profile.displayName || "—")}</td><td><span class="status ${state}" data-admin-copy="${state}" data-no-translate>${esc(adminCopy(state))}</span></td><td data-no-translate>${esc(profile.birthDate || "—")}</td><td>${esc(profile.skinTone || "—")}</td><td>${esc(profile.bodyType || "—")}</td><td><div class="row-actions"><button class="button" type="button" data-view="${esc(member.id)}" data-operation-key="proof:${esc(member.id)}">查看證件</button><button class="button danger" type="button" data-delete-member="${esc(member.id)}">刪除</button></div></td></tr>`;
      }).join("");
      rows.querySelectorAll("[data-view]").forEach(button => button.addEventListener("click", () => viewProof(allMembers.find(member => member.id === button.dataset.view))));
      rows.querySelectorAll("[data-delete-member]").forEach(button => button.addEventListener("click", () => deleteMember(button.dataset.deleteMember)));
      window.LockspaceI18n?.translateDocument(document);
      enhanceTable(rows);
      updateOperationButtons();
    }
    async function deleteMember(id){if(!confirm("確定刪除這位會員的個人資料與相關內容，並停用其會員資格？此操作無法復原。"))return;const memberSnapshot=await getDoc(doc(db,"members",id));const username=memberSnapshot.exists()?memberSnapshot.data().username||"已刪除會員":"已刪除會員";const [submissionSnapshot,reviewSnapshot,reportSnapshot,feedbackSnapshot,taskSnapshot,ideaSnapshot]=await Promise.all([getDocs(collection(db,"submissions")),getDocs(collection(db,"reviews")),getDocs(collection(db,"reports")),getDocs(collection(db,"feedback")),getDocs(collection(db,"dailyMemberTasks")),getDocs(collection(db,"taskIdeas"))]);const ownedSubmissionIds=new Set(submissionSnapshot.docs.filter(item=>item.data().ownerId===id).map(item=>item.id));const relatedReviews=reviewSnapshot.docs.filter(item=>item.data().reviewerId===id||ownedSubmissionIds.has(item.data().submissionId));const relatedReports=reportSnapshot.docs.filter(item=>item.data().reporterId===id||ownedSubmissionIds.has(item.data().submissionId));const relatedFeedback=feedbackSnapshot.docs.filter(item=>item.data().userId===id);const relatedTasks=taskSnapshot.docs.filter(item=>item.data().ownerId===id);const relatedIdeas=ideaSnapshot.docs.filter(item=>item.data().ownerId===id);await setDoc(doc(db,"members",id),{username,deleted:true,deletedAt:new Date().toISOString()});await loadMembers();const cleanup=await Promise.allSettled([deleteDoc(doc(db,"birthProofs",id)),deleteDoc(doc(db,"memberPreferences",id)),...submissionSnapshot.docs.filter(item=>ownedSubmissionIds.has(item.id)).map(item=>deleteDoc(item.ref)),...relatedReviews.map(item=>deleteDoc(item.ref)),...relatedReports.map(item=>deleteDoc(item.ref)),...relatedFeedback.map(item=>deleteDoc(item.ref)),...relatedTasks.map(item=>deleteDoc(item.ref)),...relatedIdeas.map(item=>deleteDoc(item.ref))]);await Promise.all([loadTasks(),loadTaskIdeas(),loadFeedback()]);if(cleanup.some(result=>result.status==="rejected"))alert("會員已停用並從清單移除，但部分關聯資料清理失敗，請稍後再試。")}
    async function viewProof(member) {
      return runAdminAction(`proof:${member.id}`, async () => {
        const proof = await getDoc(doc(db, "birthProofs", member.id));
        if (!proof.exists()) return "proofMissing";
        document.querySelector("#proofDialog .proof-head strong").textContent = "生日查驗照片";
        document.getElementById("proofImage").src = proof.data().dataUrl;
        document.getElementById("proofDialog").showModal();
        return "proofOpened";
      }, null, "proofError");
    }
    async function loadTasks(){const [submissionSnapshot,reportSnapshot]=await Promise.all([getDocs(collection(db,"submissions")),getDocs(collection(db,"reports"))]);const reports=reportSnapshot.docs.map(item=>({id:item.id,...item.data()}));const tasks=submissionSnapshot.docs.map(item=>({id:item.id,...item.data()})).sort((a,b)=>String(b.createdAt).localeCompare(String(a.createdAt)));document.getElementById("taskEmpty").classList.toggle("hidden",tasks.length>0);taskRows.innerHTML=tasks.map(task=>{const related=reports.filter(report=>report.submissionId===task.id),open=related.filter(report=>report.status==="open").length,accepted=related.some(report=>report.status==="accepted");const type=task.taskType||"驗證任務",detail=task.taskInstruction||task.taskCode||"—";return `<tr><td>${esc(task.displayName||"會員")}</td><td>${esc(task.submittedDate||"—")}</td><td><strong>${esc(type)}</strong><br><span class="muted">${esc(detail)}</span></td><td>${open||related.length}</td><td>${accepted?"已接受":open?"待處理":"無檢舉"}</td><td><div class="row-actions"><button class="button" type="button" data-task-view="${task.id}">查看任務</button>${open?`<button class="button primary" type="button" data-handle="${task.id}" data-operation-key="reports:${task.id}">接受檢舉</button>`:""}<button class="button danger" type="button" data-delete-task="${task.id}">刪除任務</button></div></td></tr>`}).join("");taskRows.querySelectorAll("[data-task-view]").forEach(button=>button.addEventListener("click",()=>viewTask(tasks.find(task=>task.id===button.dataset.taskView))));taskRows.querySelectorAll("[data-handle]").forEach(button=>button.addEventListener("click",()=>acceptReports(button.dataset.handle,reports)));taskRows.querySelectorAll("[data-delete-task]").forEach(button=>button.addEventListener("click",()=>deleteTask(button.dataset.deleteTask)));window.LockspaceI18n?.translateDocument(document);enhanceTable(taskRows);updateOperationButtons()}
    function viewTask(task){document.getElementById("proofImage").src=task.imageDataUrl;document.querySelector("#proofDialog .proof-head strong").textContent="任務驗證照片";document.getElementById("proofDialog").showModal()}
    async function acceptReports(submissionId, reports) {
      return runAdminAction(`reports:${submissionId}`, async () => {
        await Promise.all(reports.filter(report => report.submissionId === submissionId && report.status === "open").map(report => updateDoc(doc(db, "reports", report.id), { status:"accepted", reviewedAt:serverTimestamp(), reviewedBy:auth.currentUser.uid })));
        return "reportsDone";
      }, () => loadSection("tasks"), "reportsError");
    }
    async function deleteTask(submissionId){if(!confirm("確定永久刪除這筆任務，以及相關審核與檢舉紀錄？此操作無法復原。"))return;const [reviewSnapshot,reportSnapshot]=await Promise.all([getDocs(collection(db,"reviews")),getDocs(collection(db,"reports"))]);await Promise.all([deleteDoc(doc(db,"submissions",submissionId)),...reviewSnapshot.docs.filter(item=>item.data().submissionId===submissionId).map(item=>deleteDoc(item.ref)),...reportSnapshot.docs.filter(item=>item.data().submissionId===submissionId).map(item=>deleteDoc(item.ref))]);await loadTasks()}
    async function loadTaskIdeas(){const snapshot=await getDocs(collection(db,"taskIdeas"));const ideas=snapshot.docs.map(item=>({id:item.id,...item.data()})).sort((a,b)=>String(b.createdAt||"").localeCompare(String(a.createdAt||"")));document.getElementById("ideaEmpty").classList.toggle("hidden",ideas.length>0);ideaRows.innerHTML=ideas.map(item=>{const approve=item.status!=="approved"?'<button class="button primary" type="button" data-idea-action="approved" data-idea-id="'+item.id+'" data-operation-key="idea:'+item.id+'">通過</button>':"";const reject=item.status!=="rejected"?'<button class="button" type="button" data-idea-action="rejected" data-idea-id="'+item.id+'" data-operation-key="idea:'+item.id+'">退回</button>':"";return `<tr><td>${esc(item.displayName||"會員")}</td><td><div class="feedback-copy">${esc(item.content||"—")}</div></td><td>${esc(formatDate(item.createdAt))}</td><td><span class="status ${item.status||"pending"}">${item.status==="approved"?"已通過":item.status==="rejected"?"已退回":"待審核"}</span></td><td><div class="row-actions">${approve}${reject}<button class="button danger" data-delete-idea="${item.id}">刪除</button></div></td></tr>`}).join("");ideaRows.querySelectorAll("[data-idea-action]").forEach(button=>button.addEventListener("click",()=>reviewTaskIdea(button.dataset.ideaId,button.dataset.ideaAction)));ideaRows.querySelectorAll("[data-delete-idea]").forEach(button=>button.addEventListener("click",()=>deleteTaskIdea(button.dataset.deleteIdea)));window.LockspaceI18n?.translateDocument(document);enhanceTable(ideaRows);updateOperationButtons()}
    async function reviewTaskIdea(id, status) {
      return runAdminAction(`idea:${id}`, async () => {
        await updateDoc(doc(db, "taskIdeas", id), { status, reviewedAt:serverTimestamp(), reviewedBy:auth.currentUser.uid });
        return "ideaDone";
      }, () => loadSection("ideas"), "ideaError");
    }
    async function deleteTaskIdea(id){if(!confirm("確定刪除這筆任務提案？"))return;await deleteDoc(doc(db,"taskIdeas",id));await loadTaskIdeas()}
    async function loadFeedback(){
      const snapshot=await getDocs(collection(db,"feedback"));
      const items=snapshot.docs.map(item=>({id:item.id,...item.data()})).sort((a,b)=>String(b.createdAtIso||"").localeCompare(String(a.createdAtIso||"")));
      document.getElementById("feedbackEmpty").classList.toggle("hidden",items.length>0);
      feedbackRows.innerHTML=items.map(item=>`<tr><td>${esc(item.displayName||item.username||"會員")}<br><span class="muted">${esc(item.username||"")}</span></td><td>${esc(item.opinion||"—")}</td><td><div class="feedback-copy">${esc(item.content||"—")}${item.adminReply?`<br><span class="muted">回覆：${esc(item.adminReply)}</span>`:""}</div></td><td>${esc(formatDate(item.createdAtIso))}</td><td>${item.adminReply?"已回覆":item.status==="done"?"已完成":"待處理"}</td><td><div class="row-actions"><button class="button primary" type="button" data-feedback-reply="${item.id}">${item.adminReply?"修改回覆":"回覆"}</button><button class="button danger" type="button" data-feedback-delete="${item.id}">刪除</button></div></td></tr>`).join("");
      feedbackRows.querySelectorAll("[data-feedback-reply]").forEach(button=>button.addEventListener("click",()=>openFeedbackReply(items.find(item=>item.id===button.dataset.feedbackReply))));
      feedbackRows.querySelectorAll("[data-feedback-delete]").forEach(button=>button.addEventListener("click",()=>deleteFeedback(button)));
      window.LockspaceI18n?.translateDocument(document);enhanceTable(feedbackRows);
    }
    function openFeedbackReply(item){const form=document.getElementById("replyForm");form.dataset.feedbackId=item.id;form.elements.reply.value=item.adminReply||"";document.getElementById("replyError").classList.add("hidden");document.getElementById("replyDialog").showModal()}
    async function submitFeedbackReply(event){event.preventDefault();const form=event.currentTarget,button=form.querySelector('button[type="submit"]'),reply=String(form.elements.reply.value||"").trim();if(!reply)return;button.disabled=true;try{await updateDoc(doc(db,"feedback",form.dataset.feedbackId),{adminReply:reply,status:"replied",repliedAt:serverTimestamp(),repliedAtIso:new Date().toISOString(),repliedBy:auth.currentUser.uid});document.getElementById("replyDialog").close();await loadFeedback()}catch(error){const box=document.getElementById("replyError");box.textContent=`回覆失敗：${error.message||"請稍後再試"}`;box.classList.remove("hidden")}finally{button.disabled=false}}
    async function deleteFeedback(button){if(!confirm("確定刪除這筆回饋？此操作無法復原。"))return;button.disabled=true;const original=button.textContent;button.textContent="刪除中…";try{await deleteDoc(doc(db,"feedback",button.dataset.feedbackDelete));await loadFeedback()}catch(error){button.disabled=false;button.textContent=original;alert(`回饋刪除失敗：${error.message||"請稍後再試"}`)}}
    function formatDate(value){if(!value)return "—";const date=new Date(value);return Number.isNaN(date.getTime())?String(value):date.toLocaleString("zh-TW",{timeZone:"Asia/Taipei"})}
    function showError(message){const box=document.getElementById("loginError");box.textContent=message;box.classList.remove("hidden")}
    function accountEmail(username){return `${String(username).trim().toLowerCase()}@members.lockspace.app`}
    function esc(value){return String(value).replace(/[&<>"']/g,char=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"})[char])}
  </script>
</body>
</html>
