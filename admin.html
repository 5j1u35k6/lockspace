<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="application-version" content="0.4.0">
  <title>Lockspace 後台管理</title>
  <style>
    :root{color-scheme:dark;--bg:#090a09;--panel:#121412;--line:#30352f;--text:#f5f6f3;--muted:#aeb4ab;--lime:#b6ff70;--red:#ff91a6;--amber:#efd59e}
    *{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:16px/1.5 Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif}button,input,select{font:inherit}button{cursor:pointer}.hidden{display:none!important}.shell{max-width:1280px;margin:auto;padding:22px 28px 60px}.top{display:flex;align-items:center;justify-content:space-between;gap:16px;padding-bottom:18px;border-bottom:1px solid #ffffff18}.brand{font-size:22px;font-weight:800}.brand b{color:var(--lime)}.actions{display:flex;gap:8px;align-items:center}.button{display:inline-flex;align-items:center;justify-content:center;min-height:42px;padding:9px 13px;border:1px solid var(--line);border-radius:6px;background:#ffffff08;color:var(--text);text-decoration:none;font-weight:700}.button.primary{background:var(--lime);border-color:var(--lime);color:#111410}.button.danger{color:var(--red)}.login{width:min(430px,calc(100% - 28px));margin:14vh auto 0;padding:22px;border:1px solid #ffffff17;border-radius:8px;background:var(--panel)}h1{font-size:28px;margin:10px 0}h2{font-size:18px;margin:0}.muted{color:var(--muted);font-size:14px}.eyebrow{margin:0;color:var(--lime);font-size:12px;font-weight:800}.version-stamp{color:var(--muted);font-size:12px}.login .version-stamp{margin:18px 0 0;text-align:center}label{display:block;margin:12px 0;color:#d9ddd7;font-size:14px;font-weight:700}input,select{display:block;width:100%;min-height:44px;margin-top:6px;padding:10px 11px;border:1px solid var(--line);border-radius:5px;background:#0b0c0b;color:var(--text)}.error{padding:10px 12px;border:1px solid #ff617538;border-radius:6px;color:#ffb0bf;background:#ff617510}.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;margin:20px 0}.stat{padding:16px;border:1px solid #ffffff14;background:var(--panel);border-radius:8px}.stat strong{display:block;font-size:28px}.table-wrap{overflow:auto;border:1px solid #ffffff16;border-radius:8px;background:var(--panel)}table{width:100%;border-collapse:collapse;min-width:880px}th,td{padding:13px 14px;text-align:left;border-bottom:1px solid #ffffff10;vertical-align:middle}th{color:var(--muted);font-size:13px;font-weight:700;background:#0e100e}td{font-size:14px}.status{display:inline-block;padding:4px 8px;border-radius:999px;font-size:12px;font-weight:750}.pending{color:var(--amber);background:#efd59e16}.approved{color:var(--lime);background:#b6ff7014}.rejected{color:var(--red);background:#ff91a614}.row-actions{display:flex;gap:6px;white-space:nowrap}.empty{padding:38px;text-align:center;color:var(--muted)}
    @media(max-width:700px){.shell{padding:16px}.top{align-items:flex-start;flex-direction:column}.stats{grid-template-columns:1fr}.actions{width:100%;flex-wrap:wrap}}
  </style>
</head>
<body>
  <main id="login" class="login">
    <p class="eyebrow">ADMIN</p><h1>後台管理</h1>
    <form id="loginForm">
      <label>管理員帳號<input name="account" autocomplete="username" required></label>
      <label>密碼<input name="password" type="password" autocomplete="current-password" required></label>
      <p id="loginError" class="error hidden"></p>
      <button class="button primary" type="submit">登入</button>
    </form>
    <p class="version-stamp">Lockspace Admin v0.4.0</p>
  </main>

  <main id="dashboard" class="shell hidden">
    <header class="top"><div><div class="brand">lockspace<b>.</b> 管理</div><span class="version-stamp">v0.4.0</span></div><div class="actions"><a class="button" href="index.html">會員頁</a><button id="logout" class="button" type="button">登出</button></div></header>
    <section class="stats"><div class="stat"><span class="muted">會員</span><strong id="total">0</strong></div><div class="stat"><span class="muted">待查驗</span><strong id="pending">0</strong></div><div class="stat"><span class="muted">已通過</span><strong id="approved">0</strong></div></section>
    <div class="table-wrap"><table><thead><tr><th>帳號</th><th>顯示名稱</th><th>生日</th><th>膚色</th><th>身材</th><th>狀態</th><th>操作</th></tr></thead><tbody id="memberRows"></tbody></table><div id="empty" class="empty hidden">尚無會員資料</div></div>
  </main>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/12.3.0/firebase-app.js";
    import { getAuth, signInWithEmailAndPassword, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/12.3.0/firebase-auth.js";
    import { getFirestore, collection, doc, getDoc, getDocs, updateDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/12.3.0/firebase-firestore.js";
    const APP_VERSION="0.4.0";
    const config={apiKey:"AIzaSyCaM21hcPsRHxJ-YdIzWpjPu0aneRPPvOI",authDomain:"lockspace-19edc.firebaseapp.com",projectId:"lockspace-19edc",storageBucket:"lockspace-19edc.firebasestorage.app",messagingSenderId:"726438557640",appId:"1:726438557640:web:d0e51ec0280cd1066e32fd"};
    const app=initializeApp(config),auth=getAuth(app),db=getFirestore(app);
    const login=document.getElementById("login"),dashboard=document.getElementById("dashboard"),rows=document.getElementById("memberRows");
    document.getElementById("loginForm").addEventListener("submit",async event=>{event.preventDefault();const data=Object.fromEntries(new FormData(event.target));try{await signInWithEmailAndPassword(auth,accountEmail(data.account),data.password)}catch{showError("帳號、密碼或管理權限不正確。")}});
    document.getElementById("logout").addEventListener("click",()=>signOut(auth));
    onAuthStateChanged(auth,async user=>{if(!user){login.classList.remove("hidden");dashboard.classList.add("hidden");return}const admin=await getDoc(doc(db,"admins",user.uid));if(!admin.exists()){showError("這個帳號沒有管理權限。");await signOut(auth);return}login.classList.add("hidden");dashboard.classList.remove("hidden");await loadMembers()});
    async function loadMembers(){const snapshot=await getDocs(collection(db,"members"));const members=snapshot.docs.map(item=>({id:item.id,...item.data()}));document.getElementById("total").textContent=members.length;document.getElementById("pending").textContent=members.filter(m=>m.verification?.status==="pending").length;document.getElementById("approved").textContent=members.filter(m=>m.verification?.status==="approved").length;document.getElementById("empty").classList.toggle("hidden",members.length>0);rows.innerHTML=members.map(member=>{const p=member.profile||{},status=member.verification?.status||"pending";return `<tr><td>${esc(member.username||"—")}</td><td>${esc(p.displayName||"—")}</td><td>${esc(p.birthDate||"—")}</td><td>${esc(p.skinTone||"—")}</td><td>${esc(p.bodyType||"—")}</td><td><span class="status ${status}">${label(status)}</span></td><td><div class="row-actions"><button class="button" data-view="${member.id}">查看證件</button><button class="button primary" data-status="approved" data-id="${member.id}">通過</button><button class="button danger" data-status="rejected" data-id="${member.id}">退回</button></div></td></tr>`}).join("");rows.querySelectorAll("[data-status]").forEach(button=>button.addEventListener("click",()=>setStatus(button.dataset.id,button.dataset.status)));rows.querySelectorAll("[data-view]").forEach(button=>button.addEventListener("click",()=>viewProof(members.find(m=>m.id===button.dataset.view))))}
    async function setStatus(id,status){await updateDoc(doc(db,"members",id),{"verification.status":status,"verification.reviewedAt":serverTimestamp(),"verification.reviewedBy":auth.currentUser.uid});await loadMembers()}
    async function viewProof(member){const proof=await getDoc(doc(db,"birthProofs",member.id));if(!proof.exists())return alert("尚未上傳證件生日照片。");const popup=window.open("","_blank","noopener");if(popup){popup.document.write(`<title>生日查驗</title><style>body{margin:0;background:#090a09;display:grid;place-items:center;min-height:100vh}img{max-width:96vw;max-height:96vh;object-fit:contain}</style><img src="${proof.data().dataUrl}" alt="證件生日照片">`);popup.document.close()}}
    function showError(message){const box=document.getElementById("loginError");box.textContent=message;box.classList.remove("hidden")}
    function accountEmail(username){return `${String(username).trim().toLowerCase()}@members.lockspace.app`}
    function label(status){return({pending:"待查驗",approved:"已通過",rejected:"需重傳"})[status]||status}
    function esc(value){return String(value).replace(/[&<>"']/g,char=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"})[char])}
  </script>
</body>
</html>
