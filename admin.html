<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="application-version" content="0.14.2">
  <title>lockspace. 後台管理</title>
  <style>
    :root{color-scheme:dark;--bg:#090a09;--panel:#121412;--line:#30352f;--text:#f5f6f3;--muted:#aeb4ab;--lime:#b6ff70;--red:#ff91a6;--amber:#efd59e}
    *{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:16px/1.5 Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif}button,input,select,textarea{font:inherit}button{cursor:pointer}.hidden{display:none!important}.shell{max-width:1280px;margin:auto;padding:22px 28px 60px}.top{display:flex;align-items:center;justify-content:space-between;gap:16px;padding-bottom:18px;border-bottom:1px solid #ffffff18}.brand{font-size:22px;font-weight:800}.brand b{color:var(--lime)}.actions{display:flex;gap:8px;align-items:center}.button{display:inline-flex;align-items:center;justify-content:center;min-height:42px;padding:9px 13px;border:1px solid var(--line);border-radius:6px;background:#ffffff08;color:var(--text);text-decoration:none;font-weight:700}.button.primary{background:var(--lime);border-color:var(--lime);color:#111410}.button.danger{color:var(--red)}.login{width:min(430px,calc(100% - 28px));margin:14vh auto 0;padding:22px;border:1px solid #ffffff17;border-radius:8px;background:var(--panel)}h1{font-size:28px;margin:10px 0}h2{font-size:18px;margin:0}.muted{color:var(--muted);font-size:14px}.eyebrow{margin:0;color:var(--lime);font-size:12px;font-weight:800}.version-stamp{color:var(--muted);font-size:12px}.login .version-stamp{margin:18px 0 0;text-align:center}label{display:block;margin:12px 0;color:#d9ddd7;font-size:14px;font-weight:700}input,select,textarea{display:block;width:100%;min-height:44px;margin-top:6px;padding:10px 11px;border:1px solid var(--line);border-radius:5px;background:#0b0c0b;color:var(--text)}textarea{min-height:150px;resize:vertical}.error{padding:10px 12px;border:1px solid #ff617538;border-radius:6px;color:#ffb0bf;background:#ff617510}.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;margin:20px 0}.stat{padding:16px;border:1px solid #ffffff14;background:var(--panel);border-radius:8px}.stat strong{display:block;font-size:28px}.table-wrap{overflow:auto;border:1px solid #ffffff16;border-radius:8px;background:var(--panel)}table{width:100%;border-collapse:collapse;min-width:880px}th,td{padding:13px 14px;text-align:left;border-bottom:1px solid #ffffff10;vertical-align:middle}th{color:var(--muted);font-size:13px;font-weight:700;background:#0e100e}td{font-size:14px}.status{display:inline-block;padding:4px 8px;border-radius:999px;font-size:12px;font-weight:750}.pending{color:var(--amber);background:#efd59e16}.approved{color:var(--lime);background:#b6ff7014}.rejected{color:var(--red);background:#ff91a614}.row-actions{display:flex;gap:6px;white-space:nowrap}.feedback-copy{max-width:520px;white-space:pre-wrap;word-break:break-word}.empty{padding:38px;text-align:center;color:var(--muted)}dialog{width:min(760px,calc(100% - 28px));padding:0;border:1px solid #ffffff20;border-radius:8px;background:var(--panel);color:var(--text)}dialog::backdrop{background:#000b}.proof-head{display:flex;justify-content:space-between;align-items:center;padding:14px 16px;border-bottom:1px solid #ffffff18}.proof-body{padding:16px;text-align:center}.proof-body img{display:block;max-width:100%;max-height:72vh;margin:auto;object-fit:contain}.reply-body{padding:16px}.reply-actions{display:flex;justify-content:flex-end;gap:8px;padding:0 16px 16px}
    @media(max-width:700px){.shell{padding:16px}.top{align-items:flex-start;flex-direction:column}.stats{grid-template-columns:1fr}.actions{width:100%;flex-wrap:wrap}}
  </style>
</head>
<body>
  <main id="login" class="login">
    <p class="eyebrow">ADMIN</p><h1>後台管理</h1>
    <form id="loginForm">
      <label>管理員帳號<input name="account" autocomplete="username" required></label>
      <label>密碼<input name="password" type="password" autocomplete="current-password" required></label>
      <p id="loginError" class="error hidden"></p>
      <button class="button primary" type="submit">登入</button>
    </form>
    <p class="version-stamp">Lockspace Admin v0.14.2</p>
  </main>

  <main id="dashboard" class="shell hidden">
    <header class="top"><div><div class="brand">lockspace<b>.</b> 管理</div><span class="version-stamp">v0.14.2</span></div><div class="actions"><a class="button" href="index.html">會員頁</a><button id="logout" class="button" type="button">登出</button></div></header>
    <p id="dashboardError" class="error hidden" role="alert"></p>
    <section class="stats"><div class="stat"><span class="muted">會員</span><strong id="total">0</strong></div><div class="stat"><span class="muted">待查驗</span><strong id="pending">0</strong></div><div class="stat"><span class="muted">已通過</span><strong id="approved">0</strong></div></section>
    <div class="table-wrap"><table><thead><tr><th>帳號</th><th>顯示名稱</th><th>生日</th><th>膚色</th><th>身材</th><th>操作</th></tr></thead><tbody id="memberRows"></tbody></table><div id="empty" class="empty hidden">尚無會員資料</div></div>
    <section style="margin-top:28px"><h2>任務與檢舉</h2><p class="muted">檢視已發布任務、接受會員檢舉或刪除違規內容。</p><div class="table-wrap" style="margin-top:14px"><table><thead><tr><th>發布者</th><th>日期</th><th>任務細項</th><th>檢舉</th><th>處理狀態</th><th>操作</th></tr></thead><tbody id="taskRows"></tbody></table><div id="taskEmpty" class="empty hidden">尚無任務紀錄</div></div></section>
    <section style="margin-top:28px"><h2>用戶任務提案</h2><p class="muted">通過的提案會加入「用戶提供」每日任務池。</p><div class="table-wrap" style="margin-top:14px"><table><thead><tr><th>會員</th><th>提案內容</th><th>時間</th><th>狀態</th><th>操作</th></tr></thead><tbody id="ideaRows"></tbody></table><div id="ideaEmpty" class="empty hidden">尚無任務提案</div></div></section>
    <section style="margin-top:28px"><h2>問題回饋</h2><p class="muted">查看會員從登入後首頁送出的意見與內容。</p><div class="table-wrap" style="margin-top:14px"><table><thead><tr><th>會員</th><th>意見</th><th>內容</th><th>時間</th><th>狀態</th><th>操作</th></tr></thead><tbody id="feedbackRows"></tbody></table><div id="feedbackEmpty" class="empty hidden">尚無回饋</div></div></section>
  </main>

  <dialog id="proofDialog"><div class="proof-head"><strong>生日查驗照片</strong><button id="closeProof" class="button" type="button">關閉</button></div><div class="proof-body"><img id="proofImage" alt="證件生日照片"></div></dialog>
  <dialog id="replyDialog"><form id="replyForm"><div class="proof-head"><strong>回覆會員</strong><button id="closeReply" class="button" type="button">關閉</button></div><div class="reply-body"><label>回覆內容<textarea name="reply" maxlength="1200" required></textarea></label><p id="replyError" class="error hidden"></p></div><div class="reply-actions"><button class="button primary" type="submit">送出回覆</button></div></form></dialog>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/12.3.0/firebase-app.js";
    import { getAuth, signInWithEmailAndPassword, onAuthStateChanged, signOut, setPersistence, browserSessionPersistence } from "https://www.gstatic.com/firebasejs/12.3.0/firebase-auth.js";
    import { getFirestore, collection, doc, getDoc, getDocs, setDoc, updateDoc, deleteDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/12.3.0/firebase-firestore.js";
    const APP_VERSION="0.14.2";
    const config={apiKey:"AIzaSyCaM21hcPsRHxJ-YdIzWpjPu0aneRPPvOI",authDomain:"lockspace-19edc.firebaseapp.com",projectId:"lockspace-19edc",storageBucket:"lockspace-19edc.firebasestorage.app",messagingSenderId:"726438557640",appId:"1:726438557640:web:d0e51ec0280cd1066e32fd"};
    const app=initializeApp(config,"lockspace-admin"),auth=getAuth(app),db=getFirestore(app);await setPersistence(auth,browserSessionPersistence);
    const login=document.getElementById("login"),dashboard=document.getElementById("dashboard"),rows=document.getElementById("memberRows"),taskRows=document.getElementById("taskRows"),ideaRows=document.getElementById("ideaRows"),feedbackRows=document.getElementById("feedbackRows");
    document.getElementById("loginForm").addEventListener("submit",async event=>{event.preventDefault();const data=Object.fromEntries(new FormData(event.target));try{await signInWithEmailAndPassword(auth,accountEmail(data.account),data.password)}catch{showError("帳號、密碼或管理權限不正確。")}});
    document.getElementById("logout").addEventListener("click",()=>signOut(auth));
    document.getElementById("closeProof").addEventListener("click",()=>document.getElementById("proofDialog").close());
    document.getElementById("closeReply").addEventListener("click",()=>document.getElementById("replyDialog").close());
    document.getElementById("replyForm").addEventListener("submit",submitFeedbackReply);
    onAuthStateChanged(auth,async user=>{if(!user){login.classList.remove("hidden");dashboard.classList.add("hidden");return}try{const admin=await getDoc(doc(db,"admins",user.uid));if(!admin.exists()){showError("這個帳號沒有管理權限。");await signOut(auth);return}login.classList.add("hidden");dashboard.classList.remove("hidden");const results=await Promise.allSettled([loadMembers(),loadTasks(),loadTaskIdeas(),loadFeedback()]);const failed=results.filter(result=>result.status==="rejected").length;const box=document.getElementById("dashboardError");box.classList.toggle("hidden",failed===0);box.textContent=failed?`有 ${failed} 個管理區塊載入失敗，請檢查網路後重新整理。`:""}catch{await signOut(auth);showError("管理資料載入失敗，請檢查網路後再試。")}});
    async function loadMembers(){const snapshot=await getDocs(collection(db,"members"));const members=snapshot.docs.map(item=>({id:item.id,...item.data()})).filter(member=>member.deleted!==true);document.getElementById("total").textContent=members.length;document.getElementById("pending").textContent=members.filter(m=>m.verification?.status==="pending").length;document.getElementById("approved").textContent=members.filter(m=>m.verification?.status==="approved").length;document.getElementById("empty").classList.toggle("hidden",members.length>0);rows.innerHTML=members.map(member=>{const p=member.profile||{};return `<tr><td>${esc(member.username||"—")}</td><td>${esc(p.displayName||"—")}</td><td>${esc(p.birthDate||"—")}</td><td>${esc(p.skinTone||"—")}</td><td>${esc(p.bodyType||"—")}</td><td><div class="row-actions"><button class="button" data-view="${member.id}">查看證件</button><button class="button danger" data-delete-member="${member.id}">刪除</button></div></td></tr>`}).join("");rows.querySelectorAll("[data-view]").forEach(button=>button.addEventListener("click",()=>viewProof(members.find(m=>m.id===button.dataset.view))));rows.querySelectorAll("[data-delete-member]").forEach(button=>button.addEventListener("click",()=>deleteMember(button.dataset.deleteMember)))}
    async function deleteMember(id){if(!confirm("確定刪除這位會員的個人資料與相關內容，並停用其會員資格？此操作無法復原。"))return;const memberSnapshot=await getDoc(doc(db,"members",id));const username=memberSnapshot.exists()?memberSnapshot.data().username||"已刪除會員":"已刪除會員";const [submissionSnapshot,reviewSnapshot,reportSnapshot,feedbackSnapshot,taskSnapshot,ideaSnapshot]=await Promise.all([getDocs(collection(db,"submissions")),getDocs(collection(db,"reviews")),getDocs(collection(db,"reports")),getDocs(collection(db,"feedback")),getDocs(collection(db,"dailyMemberTasks")),getDocs(collection(db,"taskIdeas"))]);const ownedSubmissionIds=new Set(submissionSnapshot.docs.filter(item=>item.data().ownerId===id).map(item=>item.id));const relatedReviews=reviewSnapshot.docs.filter(item=>item.data().reviewerId===id||ownedSubmissionIds.has(item.data().submissionId));const relatedReports=reportSnapshot.docs.filter(item=>item.data().reporterId===id||ownedSubmissionIds.has(item.data().submissionId));const relatedFeedback=feedbackSnapshot.docs.filter(item=>item.data().userId===id);const relatedTasks=taskSnapshot.docs.filter(item=>item.data().ownerId===id);const relatedIdeas=ideaSnapshot.docs.filter(item=>item.data().ownerId===id);await setDoc(doc(db,"members",id),{username,deleted:true,deletedAt:new Date().toISOString()});await loadMembers();const cleanup=await Promise.allSettled([deleteDoc(doc(db,"birthProofs",id)),deleteDoc(doc(db,"memberPreferences",id)),...submissionSnapshot.docs.filter(item=>ownedSubmissionIds.has(item.id)).map(item=>deleteDoc(item.ref)),...relatedReviews.map(item=>deleteDoc(item.ref)),...relatedReports.map(item=>deleteDoc(item.ref)),...relatedFeedback.map(item=>deleteDoc(item.ref)),...relatedTasks.map(item=>deleteDoc(item.ref)),...relatedIdeas.map(item=>deleteDoc(item.ref))]);await Promise.all([loadTasks(),loadTaskIdeas(),loadFeedback()]);if(cleanup.some(result=>result.status==="rejected"))alert("會員已停用並從清單移除，但部分關聯資料清理失敗，請稍後再試。")}
    async function viewProof(member){const proof=await getDoc(doc(db,"birthProofs",member.id));if(!proof.exists())return alert("尚未上傳證件生日照片。");document.querySelector("#proofDialog .proof-head strong").textContent="生日查驗照片";document.getElementById("proofImage").src=proof.data().dataUrl;document.getElementById("proofDialog").showModal()}
    async function loadTasks(){const [submissionSnapshot,reportSnapshot]=await Promise.all([getDocs(collection(db,"submissions")),getDocs(collection(db,"reports"))]);const reports=reportSnapshot.docs.map(item=>({id:item.id,...item.data()}));const tasks=submissionSnapshot.docs.map(item=>({id:item.id,...item.data()})).sort((a,b)=>String(b.createdAt).localeCompare(String(a.createdAt)));document.getElementById("taskEmpty").classList.toggle("hidden",tasks.length>0);taskRows.innerHTML=tasks.map(task=>{const related=reports.filter(report=>report.submissionId===task.id),open=related.filter(report=>report.status==="open").length,accepted=related.some(report=>report.status==="accepted");const type=task.taskType||"驗證任務",detail=task.taskInstruction||task.taskCode||"—";return `<tr><td>${esc(task.displayName||"會員")}</td><td>${esc(task.submittedDate||"—")}</td><td><strong>${esc(type)}</strong><br><span class="muted">${esc(detail)}</span></td><td>${open||related.length}</td><td>${accepted?"已接受":open?"待處理":"無檢舉"}</td><td><div class="row-actions"><button class="button" type="button" data-task-view="${task.id}">查看任務</button>${open?`<button class="button primary" type="button" data-handle="${task.id}">接受檢舉</button>`:""}<button class="button danger" type="button" data-delete-task="${task.id}">刪除任務</button></div></td></tr>`}).join("");taskRows.querySelectorAll("[data-task-view]").forEach(button=>button.addEventListener("click",()=>viewTask(tasks.find(task=>task.id===button.dataset.taskView))));taskRows.querySelectorAll("[data-handle]").forEach(button=>button.addEventListener("click",()=>acceptReports(button.dataset.handle,reports)));taskRows.querySelectorAll("[data-delete-task]").forEach(button=>button.addEventListener("click",()=>deleteTask(button.dataset.deleteTask)))}
    function viewTask(task){document.getElementById("proofImage").src=task.imageDataUrl;document.querySelector("#proofDialog .proof-head strong").textContent="任務驗證照片";document.getElementById("proofDialog").showModal()}
    async function acceptReports(submissionId,reports){await Promise.all(reports.filter(report=>report.submissionId===submissionId&&report.status==="open").map(report=>updateDoc(doc(db,"reports",report.id),{status:"accepted",reviewedAt:serverTimestamp(),reviewedBy:auth.currentUser.uid})));await loadTasks()}
    async function deleteTask(submissionId){if(!confirm("確定永久刪除這筆任務，以及相關審核與檢舉紀錄？此操作無法復原。"))return;const [reviewSnapshot,reportSnapshot]=await Promise.all([getDocs(collection(db,"reviews")),getDocs(collection(db,"reports"))]);await Promise.all([deleteDoc(doc(db,"submissions",submissionId)),...reviewSnapshot.docs.filter(item=>item.data().submissionId===submissionId).map(item=>deleteDoc(item.ref)),...reportSnapshot.docs.filter(item=>item.data().submissionId===submissionId).map(item=>deleteDoc(item.ref))]);await loadTasks()}
    async function loadTaskIdeas(){const snapshot=await getDocs(collection(db,"taskIdeas"));const ideas=snapshot.docs.map(item=>({id:item.id,...item.data()})).sort((a,b)=>String(b.createdAt||"").localeCompare(String(a.createdAt||"")));document.getElementById("ideaEmpty").classList.toggle("hidden",ideas.length>0);ideaRows.innerHTML=ideas.map(item=>{const approve=item.status!=="approved"?'<button class="button primary" data-idea-action="approved" data-idea-id="'+item.id+'">通過</button>':"";const reject=item.status!=="rejected"?'<button class="button" data-idea-action="rejected" data-idea-id="'+item.id+'">退回</button>':"";return `<tr><td>${esc(item.displayName||"會員")}</td><td><div class="feedback-copy">${esc(item.content||"—")}</div></td><td>${esc(formatDate(item.createdAt))}</td><td><span class="status ${item.status||"pending"}">${item.status==="approved"?"已通過":item.status==="rejected"?"已退回":"待審核"}</span></td><td><div class="row-actions">${approve}${reject}<button class="button danger" data-delete-idea="${item.id}">刪除</button></div></td></tr>`}).join("");ideaRows.querySelectorAll("[data-idea-action]").forEach(button=>button.addEventListener("click",()=>reviewTaskIdea(button.dataset.ideaId,button.dataset.ideaAction)));ideaRows.querySelectorAll("[data-delete-idea]").forEach(button=>button.addEventListener("click",()=>deleteTaskIdea(button.dataset.deleteIdea)))}
    async function reviewTaskIdea(id,status){await updateDoc(doc(db,"taskIdeas",id),{status,reviewedAt:serverTimestamp(),reviewedBy:auth.currentUser.uid});await loadTaskIdeas()}
    async function deleteTaskIdea(id){if(!confirm("確定刪除這筆任務提案？"))return;await deleteDoc(doc(db,"taskIdeas",id));await loadTaskIdeas()}
    async function loadFeedback(){
      const snapshot=await getDocs(collection(db,"feedback"));
      const items=snapshot.docs.map(item=>({id:item.id,...item.data()})).sort((a,b)=>String(b.createdAtIso||"").localeCompare(String(a.createdAtIso||"")));
      document.getElementById("feedbackEmpty").classList.toggle("hidden",items.length>0);
      feedbackRows.innerHTML=items.map(item=>`<tr><td>${esc(item.displayName||item.username||"會員")}<br><span class="muted">${esc(item.username||"")}</span></td><td>${esc(item.opinion||"—")}</td><td><div class="feedback-copy">${esc(item.content||"—")}${item.adminReply?`<br><span class="muted">回覆：${esc(item.adminReply)}</span>`:""}</div></td><td>${esc(formatDate(item.createdAtIso))}</td><td>${item.adminReply?"已回覆":item.status==="done"?"已完成":"待處理"}</td><td><div class="row-actions"><button class="button primary" type="button" data-feedback-reply="${item.id}">${item.adminReply?"修改回覆":"回覆"}</button><button class="button danger" type="button" data-feedback-delete="${item.id}">刪除</button></div></td></tr>`).join("");
      feedbackRows.querySelectorAll("[data-feedback-reply]").forEach(button=>button.addEventListener("click",()=>openFeedbackReply(items.find(item=>item.id===button.dataset.feedbackReply))));
      feedbackRows.querySelectorAll("[data-feedback-delete]").forEach(button=>button.addEventListener("click",()=>deleteFeedback(button)));
    }
    function openFeedbackReply(item){const form=document.getElementById("replyForm");form.dataset.feedbackId=item.id;form.elements.reply.value=item.adminReply||"";document.getElementById("replyError").classList.add("hidden");document.getElementById("replyDialog").showModal()}
    async function submitFeedbackReply(event){event.preventDefault();const form=event.currentTarget,button=form.querySelector('button[type="submit"]'),reply=String(form.elements.reply.value||"").trim();if(!reply)return;button.disabled=true;try{await updateDoc(doc(db,"feedback",form.dataset.feedbackId),{adminReply:reply,status:"replied",repliedAt:serverTimestamp(),repliedAtIso:new Date().toISOString(),repliedBy:auth.currentUser.uid});document.getElementById("replyDialog").close();await loadFeedback()}catch(error){const box=document.getElementById("replyError");box.textContent=`回覆失敗：${error.message||"請稍後再試"}`;box.classList.remove("hidden")}finally{button.disabled=false}}
    async function deleteFeedback(button){if(!confirm("確定刪除這筆回饋？此操作無法復原。"))return;button.disabled=true;const original=button.textContent;button.textContent="刪除中…";try{await deleteDoc(doc(db,"feedback",button.dataset.feedbackDelete));await loadFeedback()}catch(error){button.disabled=false;button.textContent=original;alert(`回饋刪除失敗：${error.message||"請稍後再試"}`)}}
    function formatDate(value){if(!value)return "—";const date=new Date(value);return Number.isNaN(date.getTime())?String(value):date.toLocaleString("zh-TW",{timeZone:"Asia/Taipei"})}
    function showError(message){const box=document.getElementById("loginError");box.textContent=message;box.classList.remove("hidden")}
    function accountEmail(username){return `${String(username).trim().toLowerCase()}@members.lockspace.app`}
    function esc(value){return String(value).replace(/[&<>"']/g,char=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"})[char])}
  </script>
</body>
</html>
